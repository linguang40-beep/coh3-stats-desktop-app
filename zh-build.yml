name: Build Chinese Windows test version
on:
  workflow_dispatch:
  push:
    paths:
      - zh-patch.zip
      - .github/workflows/zh-build.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply translations
        shell: pwsh
        run: Expand-Archive -Path zh-patch.zip -DestinationPath . -Force
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000
      - name: Compile frontend
        run: yarn tsc && yarn vite build --target chrome100
      - name: Compile Windows executable
        working-directory: src-tauri
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Grenadier-2.3.0-zh-test
          path: src-tauri/target/release/coh3-stats-desktop-app.exe
          if-no-files-found: error


